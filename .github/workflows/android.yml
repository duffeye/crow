name: Android checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crow-debug-apk
          path: release-apk
      - name: Prepare versioned APK and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export RELEASE_VERSION="${RELEASE_TAG#v}"
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('app/build.gradle').read_text()
          version = re.search(r"versionName '([^']+)'", source).group(1)
          if version != os.environ['RELEASE_VERSION']:
              raise SystemExit('Release tag must match the app versionName')
          PY
          test -s "release-notes/$RELEASE_TAG.md"
          mv release-apk/app-debug.apk "release-apk/crow-$RELEASE_TAG.apk"
          cd release-apk
          sha256sum "crow-$RELEASE_TAG.apk" > SHA256SUMS.txt
      - name: Publish downloadable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-apk/crow-$RELEASE_TAG.apk" release-apk/SHA256SUMS.txt \
            --verify-tag --prerelease --latest=false \
            --title "Crow $RELEASE_TAG — Karoo camera remote" \
            --notes-file "release-notes/$RELEASE_TAG.md"
